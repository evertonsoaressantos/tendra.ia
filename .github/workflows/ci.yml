name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: tendra_test
          POSTGRES_PASSWORD: tendra_test_local_only
          POSTGRES_DB: tendra_test_pilot
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tendra_test -d tendra_test_pilot"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://tendra_test:tendra_test_local_only@127.0.0.1:55432/tendra_test_pilot
      - run: docker network create -o com.docker.network.bridge.host_binding_ipv4=127.0.0.1 tendra-local
      - run: npx supabase start --network-id tendra-local --yes > /dev/null 2>&1
      - run: npm run test:services
      - run: npm run build
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/compose.yaml config --quiet
      - run: docker compose -f infra/compose.yaml build web worker-tools
      - run: docker compose -f infra/compose.yaml run --rm --no-deps worker-tools
      - run: docker compose -f infra/compose.yaml --profile scan up -d --no-build --wait web clamav
      - run: curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null
      - run: curl --fail --silent --show-error http://127.0.0.1:3000/design-system > /dev/null
      - if: always()
        run: docker compose -f infra/compose.yaml --profile scan down
